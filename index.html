<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ani-Me Log</title>
<style>
:root{--bg:#0d0a14;--side:#110d1b;--card:#171221;--line:#2a2238;--text:#f1ecfa;--mut:#9a90b0;--ac:#a259f2;--sel:#3a2358}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
aside{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:21px;letter-spacing:.02em;padding:0 10px 22px}
.brand span{color:var(--ac)}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.nav{background:none;border:0;text-align:left;padding:12px 14px;border-radius:12px;color:var(--mut);cursor:pointer;font-size:15px}
.nav:hover{color:var(--text)}
.nav.on{background:var(--sel);color:var(--text);box-shadow:inset 3px 0 var(--ac)}
.stat{margin-top:auto;padding:10px 14px;color:var(--mut);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:8px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;flex:none}
header p{margin:0;color:var(--mut);font-size:13px}
.search{flex:1;max-width:520px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;outline:0}
.search:focus,.btn:focus-visible,.nav:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.sm{padding:5px 11px;font-size:13px}
section{padding:28px 32px;flex:1}
.hero{border:1px solid var(--line);border-radius:20px;min-height:300px;padding:44px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;background:linear-gradient(90deg,#0d0a14ee 35%,#0d0a1466),var(--hb,none) center/cover,#1a1229;margin-bottom:32px}
.hero h2{margin:0;font-size:clamp(32px,5vw,58px);line-height:1.05;max-width:16ch}
.hero p{margin:0;color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
h3{margin:0 0 16px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.poster{aspect-ratio:2/3;background:#231a34;position:relative;display:grid;place-items:center;font-size:42px;color:var(--ac)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{padding:10px 12px}
.cb a,.cb b{display:block;font-weight:600;font-size:14px;color:var(--text);text-decoration:none;line-height:1.3}
.cb a:hover{color:var(--ac)}
.cb small{color:var(--mut);font-size:12px}
.tag{display:inline-block;background:var(--sel);border-radius:6px;padding:1px 7px;margin:4px 4px 0 0;font-size:11px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
.panel form{display:grid;gap:10px}
.panel input,.panel textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.src{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src div{flex:1;min-width:0}
.src small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:#f87171!important;white-space:normal!important}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.nums{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:28px}
.nums b{display:block;font-size:30px}
.nums span{color:var(--mut);font-size:13px}
footer{padding:20px 32px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;text-align:center;letter-spacing:.04em}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sel);border:1px solid var(--ac);padding:10px 18px;border-radius:10px;display:none;z-index:9}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{width:100%;padding:0 6px 6px}.stat{display:none}header{flex-wrap:wrap;padding:14px 16px}section{padding:20px 16px}.hero{padding:24px}}
</style>
</head>
<body>
<aside>
  <div class="brand">ANI-ME <span>LOG</span><small>Source viewer</small></div>
  <button class="nav" data-v="home">Home</button>
  <button class="nav" data-v="library">Library</button>
  <button class="nav" data-v="dupes">Duplicates</button>
  <button class="nav" data-v="sources">Sources</button>
  <div class="stat"><span class="dot"></span><span id="side"></span></div>
</aside>
<main>
  <header>
    <div><h1 id="ttl">Home</h1><p id="sub"></p></div>
    <input class="search" id="q" type="search" placeholder="Search titles…" aria-label="Search titles">
    <button class="btn" data-act="refresh">Refresh all</button>
  </header>
  <section id="view"></section>
  <footer>thewiltedpetals.blooms</footer>
</main>
<div id="toast" role="status"></div>
<script>
const K='animelog.v1', $=s=>document.querySelector(s);
let st={sources:[],proxy:''}, view='home', q='';
try{Object.assign(st,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){toast('Browser storage is full, so this session won’t be cached.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}

/* ---- duplicate scanner: one normalised key per title ---- */
const norm=t=>String(t).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/[(\[][^)\]]*(dub|sub|raw|uncensored)[^)\]]*[)\]]/g,' ')
  .replace(/\b(english dub|dubbed|subbed|uncensored)\b/g,' ')
  .replace(/[^a-z0-9]+/g,' ').trim();

/* ---- parsing: any JSON shape or RSS/Atom ---- */
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const first=(o,ps)=>{for(const p of ps){const v=get(o,p);if(v&&typeof v!=='object')return v}return ''};
function mapItem(o){
  if(typeof o==='string')return{title:o.trim()};
  if(!o||typeof o!=='object')return null;
  const title=first(o,['title','name','title.english','title.romaji','title_english','attributes.canonicalTitle']);
  if(!title)return null;
  return{title:String(title).trim(),
    image:first(o,['image','img','poster','cover','thumbnail','images.jpg.image_url','coverImage.large','attributes.posterImage.small']),
    link:first(o,['url','link','href']),ep:first(o,['episode','ep','latest_episode'])};
}
function findList(d){
  if(Array.isArray(d))return d;
  if(d&&typeof d==='object'){
    for(const k of ['data','items','results','anime','entries','list','media','series']){
      if(Array.isArray(d[k]))return d[k];
      if(d[k]&&typeof d[k]==='object'){const r=findList(d[k]);if(r.length)return r}
    }
    const v=Object.values(d).find(Array.isArray);if(v)return v;
  }
  return[];
}
function parseXML(txt){
  const x=new DOMParser().parseFromString(txt,'text/xml');
  if(x.querySelector('parsererror'))throw new Error('Not valid JSON or RSS/Atom');
  return[...x.querySelectorAll('item,entry')].map(n=>{
    const g=t=>n.querySelector(t)?.textContent?.trim()||'';
    const l=n.querySelector('link');
    const th=n.getElementsByTagName('media:thumbnail')[0]||n.querySelector('enclosure');
    return{title:g('title'),link:l?(l.getAttribute('href')||l.textContent.trim()):'',image:th?.getAttribute('url')||''};
  }).filter(i=>i.title);
}
function parseText(txt){
  let d;try{d=JSON.parse(txt)}catch(e){return parseXML(txt)}
  return findList(d).map(mapItem).filter(Boolean);
}

/* ---- loading ---- */
async function load(s){
  s.status='loading';render();
  try{
    let txt=s.raw;
    if(txt==null){
      const r=await fetch(st.proxy?st.proxy+encodeURIComponent(s.url):s.url);
      if(!r.ok)throw new Error('HTTP '+r.status);
      txt=await r.text();
    }
    s.items=parseText(txt);s.status='ok';s.error='';s.updated=Date.now();
    if(!s.items.length)s.error='Loaded, but no titles were found in this source.';
  }catch(e){
    s.status='error';
    s.error=e.message==='Failed to fetch'?'The source blocked the request (CORS) or you’re offline. Try a proxy under Sources.':e.message;
  }
  save();render();
}
const refreshAll=()=>Promise.all(st.sources.filter(s=>s.url).map(load));

function build(){
  const m=new Map();let total=0;
  st.sources.forEach(s=>(s.items||[]).forEach(i=>{
    total++;const k=norm(i.title);if(!k)return;
    let e=m.get(k);
    if(!e){e={title:i.title,image:i.image,link:i.link,ep:i.ep,src:[],hits:0};m.set(k,e)}
    else{e.image=e.image||i.image;e.link=e.link||i.link;e.ep=e.ep||i.ep}
    e.hits++;if(!e.src.includes(s.name))e.src.push(s.name);
  }));
  const list=[...m.values()].sort((a,b)=>a.title.localeCompare(b.title));
  return{list,total,skipped:total-list.length};
}

/* ---- rendering ---- */
const card=e=>`<article class="card"><div class="poster">${esc(e.title[0]||'?')}${e.image?`<img src="${safe(e.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
<div class="cb">${safe(e.link)?`<a href="${safe(e.link)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a>`:`<b>${esc(e.title)}</b>`}
${e.ep?`<small>Episode ${esc(e.ep)}</small>`:''}<div>${e.src.map(n=>`<span class="tag">${esc(n)}</span>`).join('')}</div></div></article>`;
const grid=l=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p class="empty">Nothing to show yet. Add a source under Sources.</p>`;

function srcView(){
  return`<div class="panel"><h3>Add a source</h3>
<form id="add"><input name="name" placeholder="Name (optional)" aria-label="Source name">
<input name="url" placeholder="Feed or JSON URL, e.g. https://api.jikan.moe/v4/top/anime" aria-label="Source URL">
<textarea name="raw" rows="3" placeholder="…or paste JSON / RSS text here" aria-label="Pasted data"></textarea>
<div class="row"><button class="btn pri" type="submit">Add source</button>
<label class="btn">Import file<input id="file" type="file" accept=".json,.xml,.rss,.txt" hidden></label>
<button class="btn" type="button" data-act="preset" data-n="Jikan · Top anime" data-u="https://api.jikan.moe/v4/top/anime">Try Jikan top</button>
<button class="btn" type="button" data-act="preset" data-n="Jikan · Airing now" data-u="https://api.jikan.moe/v4/seasons/now">Try Jikan airing</button>
<button class="btn" type="button" data-act="export">Export sources</button></div></form></div>
<div class="panel"><h3>Your sources (${st.sources.length})</h3>
${st.sources.map(s=>`<div class="src"><div><b>${esc(s.name)}</b><small>${esc(s.url||'Pasted / imported data')}</small>
<small class="${s.status==='error'||s.error?'err':''}">${s.status==='loading'?'Loading…':s.error||`${(s.items||[]).length} titles`}</small></div>
${s.url?`<button class="btn sm" data-act="reload" data-id="${s.id}">Reload</button>`:''}
<button class="btn sm" data-act="del" data-id="${s.id}">Remove</button></div>`).join('')||'<p class="empty">No sources yet.</p>'}</div>
<div class="panel"><h3>CORS proxy (optional)</h3><p class="empty" style="padding:0 0 10px;text-align:left">Some sites block direct requests from a browser. If one does, enter a proxy prefix that takes the encoded URL on the end.</p>
<input id="proxy" value="${esc(st.proxy)}" placeholder="https://your-proxy.example/?url=" aria-label="Proxy prefix"></div>`;
}

function render(){
  const {list,total,skipped}=build();
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const needle=norm(q);
  const f=needle?list.filter(e=>norm(e.title).includes(needle)):list;
  $('#side').textContent=`${st.sources.length} sources · ${list.length} titles`;
  const T={home:['Home','Everything your sources have, in one place'],library:['Library',`${f.length} unique titles`],dupes:['Duplicates',`${skipped} repeats merged automatically`],sources:['Sources','Add as many as you like']};
  $('#ttl').textContent=T[view][0];$('#sub').textContent=T[view][1];
  let h='';
  if(view==='home'){
    const hero=list.find(e=>e.image)||list[0];
    h=hero?`<div class="hero" style="--hb:url('${safe(hero.image).replace(/'/g,'%27')}')"><h2>${esc(hero.title)}</h2><p>Found in ${hero.src.length} source${hero.src.length>1?'s':''}: ${esc(hero.src.join(', '))}</p>
<div class="row">${safe(hero.link)?`<a class="btn pri" href="${safe(hero.link)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">Open</a>`:''}<button class="btn" data-act="go" data-v="library">Browse library</button></div></div>`
    :`<div class="hero"><h2>Add your first source</h2><p>Paste a feed URL and Ani-Me Log lists what it has.</p><div class="row"><button class="btn pri" data-act="go" data-v="sources">Add source</button></div></div>`;
    h+=`<div class="nums"><div><b>${st.sources.length}</b><span>Sources</span></div><div><b>${list.length}</b><span>Unique titles</span></div><div><b>${skipped}</b><span>Duplicates skipped</span></div></div>
<h3>${needle?'Results':'Latest in your library'}</h3>${grid(needle?f:f.slice(0,24))}`;
  }else if(view==='library')h=grid(f);
  else if(view==='dupes'){const d=f.filter(e=>e.hits>1);h=d.length?`<p class="empty" style="padding-top:0;text-align:left">These titles appeared more than once. Each is shown once in your library.</p>${grid(d)}`:'<p class="empty">No duplicates found.</p>'}
  else h=srcView();
  const keep=document.activeElement?.id==='proxy';
  if(!keep)$('#view').innerHTML=h;
}

/* ---- events ---- */
document.addEventListener('click',async ev=>{
  const n=ev.target.closest('.nav');if(n){view=n.dataset.v;render();return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=st.sources.find(x=>x.id===b.dataset.id);
  if(a==='go'){view=b.dataset.v;render()}
  if(a==='refresh'){if(!st.sources.length)return toast('Add a source first.');await refreshAll();toast('Sources refreshed.')}
  if(a==='reload'&&s)load(s);
  if(a==='del'&&s){st.sources=st.sources.filter(x=>x!==s);save();render()}
  if(a==='preset'){const f=$('#add');f.name.value=b.dataset.n;f.url.value=b.dataset.u}
  if(a==='export'){const blob=new Blob([JSON.stringify(st.sources.filter(s=>s.url).map(({name,url})=>({name,url})),null,2)],{type:'application/json'});
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='sources.json';l.click()}
});
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='add')return;ev.preventDefault();
  const f=ev.target,url=f.url.value.trim(),raw=f.raw.value.trim();
  if(!url&&!raw)return toast('Enter a URL or paste some data.');
  if(url&&!/^https?:\/\//i.test(url))return toast('The URL must start with http:// or https://');
  if(url&&st.sources.some(s=>s.url===url))return toast('That source is already added.');
  let name=f.name.value.trim();
  if(!name)name=url?new URL(url).hostname:'Pasted source';
  const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,url,items:[]};
  if(raw)s.raw=raw;
  st.sources.push(s);f.reset();await load(s);
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='file'){const fl=ev.target.files[0];if(!fl)return;const r=new FileReader();
    r.onload=()=>{const s={id:Date.now().toString(36),name:fl.name,url:'',raw:r.result,items:[]};st.sources.push(s);load(s)};r.readAsText(fl)}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){q=ev.target.value;render()}
  if(ev.target.id==='proxy'){st.proxy=ev.target.value.trim();save()}
});

/* ---- start: also pull sources.json from the repo, if present ---- */
(async()=>{
  try{
    const r=await fetch('sources.json',{cache:'no-store'});
    if(r.ok){const list=await r.json();
      (Array.isArray(list)?list:[]).forEach(x=>{
        if(x&&/^https?:\/\//i.test(x.url||'')&&!st.sources.some(s=>s.url===x.url))
          st.sources.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:x.name||new URL(x.url).hostname,url:x.url,items:[]});
      });save();
    }
  }catch(e){}
  render();
  st.sources.filter(s=>s.url&&!(s.items||[]).length).forEach(load);
})();
</script>
</body>
</html>
